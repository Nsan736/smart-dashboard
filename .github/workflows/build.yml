name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_16.4.app
  SCHEME: SmartDashboard
  IPA_NAME: SmartDashboard.ipa

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcodeを選択
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: XcodeGenをインストール
        run: brew install xcodegen

      - name: バージョンを決定
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: プロジェクトを生成
        run: xcodegen generate

      - name: テスト(iOSシミュレーター)
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -n 1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "simulator: $SIM_ID"
          xcodebuild test \
            -project SmartDashboard.xcodeproj \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee test.log | grep -E "error:|warning: unre|Test Suite|Test Case.*failed|passed|failed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: 署名なしビルド(iphoneos)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SmartDashboard.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|\*\* BUILD" || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: 失敗時のログ
        if: failure()
        run: |
          for f in test.log build.log; do
            if [ -f "$f" ]; then echo "==== $f"; grep -nE "error|failed|FAILED" "$f" | head -n 200; echo "---- tail"; tail -n 60 "$f"; fi
          done

      - name: ipaを作成
        run: |
          rm -rf Payload "$IPA_NAME"
          mkdir Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/SmartDashboard.app" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -l "$IPA_NAME"

      - name: ipaを成果物として保存
        uses: actions/upload-artifact@v4
        with:
          name: SmartDashboard-ipa
          path: ${{ env.IPA_NAME }}
          retention-days: 14

      - name: GitHub Releasesへアップロード
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA_NAME" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$IPA_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest
          fi

      - name: apps.jsonを更新してmainにコミット
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp "$IPA_NAME" "$RUNNER_TEMP/$IPA_NAME"
          cp scripts/make_apps_json.py "$RUNNER_TEMP/make_apps_json.py"
          git fetch origin main
          git checkout -B main origin/main
          python3 "$RUNNER_TEMP/make_apps_json.py" apps.json "$APP_VERSION" "$RUNNER_TEMP/$IPA_NAME" "$GITHUB_REPOSITORY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --cached --quiet; then
            echo "apps.jsonに変更なし"
          else
            git commit -m "chore: apps.json を v$APP_VERSION に更新 [skip ci]"
            git push origin main
          fi
