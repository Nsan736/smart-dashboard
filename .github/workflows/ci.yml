name: ci

# 段階の区切りで手動実行する。mainへのpushでは動かさない。
on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "apps.json"
      - "icon.png"
      - "scripts/**"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_16.4.app
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 準備(Xcode選択、XcodeGen、プロジェクト生成)
        run: |
          sudo xcode-select -s "$XCODE_APP"
          command -v xcodegen >/dev/null || brew install --quiet xcodegen
          xcodegen generate --quiet

      - name: ビルドとテスト(iOSシミュレーター)
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -E '^\s+iPhone' | head -n 1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcodebuild test \
            -project SmartDashboard.xcodeproj \
            -scheme SmartDashboard \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            > test.log 2>&1 || true
          grep -E "error:|Test Case.*failed|Executed [0-9]+ tests|\*\* TEST" test.log | sort -u | head -n 80
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: 実機向けにコンパイルできるか確認(署名なし)
        run: |
          xcodebuild build \
            -project SmartDashboard.xcodeproj \
            -scheme SmartDashboard \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > build.log 2>&1 || true
          grep -E "error:|\*\* BUILD" build.log | sort -u | head -n 80
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: 失敗時のログ
        if: failure()
        run: |
          for f in test.log build.log; do
            if [ -f "$f" ]; then echo "==== $f"; grep -nE "error|failed|FAILED" "$f" | head -n 200; echo "---- tail"; tail -n 40 "$f"; fi
          done
